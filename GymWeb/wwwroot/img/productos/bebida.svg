<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070c12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#0c121d" rx="16"/>
  <circle cx="200" cy="210" r="140" fill="url(#bgGlow)"/>
  
  <!-- Tapa -->
  <rect x="180" y="70" width="40" height="24" rx="4" fill="url(#capGrad)"/>
  <rect x="186" y="94" width="28" height="12" fill="#0284c7"/>
  
  <!-- Cuello -->
  <path d="M178,110 L222,110 L235,145 L165,145 Z" fill="url(#bottleGrad)" opacity="0.85"/>
  
  <!-- Cuerpo Botella -->
  <rect x="155" y="145" width="90" height="175" rx="20" fill="url(#waterGrad)"/>
  
  <!-- Relieve / Grip -->
  <line x1="162" y1="180" x2="238" y2="180" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="162" y1="195" x2="238" y2="195" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="162" y1="210" x2="238" y2="210" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Etiqueta -->
  <rect x="157" y="230" width="86" height="55" fill="#0b1726" opacity="0.8" rx="4"/>
  <text x="200" y="252" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#00e5ff" text-anchor="middle" letter-spacing="2">HYDRATE</text>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">PURE WATER</text>

  <!-- Brillo -->
  <path d="M165,155 Q160,230 165,305" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4" fill="none"/>
</svg>
