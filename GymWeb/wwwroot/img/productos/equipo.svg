<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="eqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070c12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#0c121d" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="url(#eqGlow)"/>

  <!-- Mancuerna estilizada -->
  <g transform="rotate(-25 200 200)">
    <!-- Barra central moleteada -->
    <rect x="130" y="190" width="140" height="20" rx="4" fill="#64748b"/>
    <line x1="150" y1="190" x2="150" y2="210" stroke="#0f172a" stroke-width="2"/>
    <line x1="165" y1="190" x2="165" y2="210" stroke="#0f172a" stroke-width="2"/>
    <line x1="235" y1="190" x2="235" y2="210" stroke="#0f172a" stroke-width="2"/>
    <line x1="250" y1="190" x2="250" y2="210" stroke="#0f172a" stroke-width="2"/>

    <!-- Discos Izquierda -->
    <rect x="100" y="130" width="30" height="140" rx="10" fill="#1e293b" stroke="#00e5ff" stroke-width="2"/>
    <rect x="80" y="145" width="20" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Discos Derecha -->
    <rect x="270" y="130" width="30" height="140" rx="10" fill="#1e293b" stroke="#00e5ff" stroke-width="2"/>
    <rect x="300" y="145" width="20" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Texto / Badge -->
  <text x="200" y="325" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#00e5ff" text-anchor="middle" letter-spacing="3">PRO EQUIPMENT</text>
</svg>
