      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070c12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="100%" stop-color="#121722"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#0c121d" rx="16"/>
